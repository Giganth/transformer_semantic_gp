[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "TSGP"
version = "0.1.0"
description = "Transformer Semantic Genetic Programming for Symbolic Regression"
readme = "README.md"
requires-python = ">=3.10,<=3.13"
license = "MIT"
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "deap>=1.3",
    "tensorflow[and-cuda]>=2.20,<2.21",
    "scipy>=1.7",
    "sympy>=1.9",
    "matplotlib>=3.4",
    "pyyaml>=6.0",
    "scikit-learn>=1.0",
    "faiss-cpu>=1.7",
    "tqdm>=4.67",
]

[project.urls]
"Homepage" = "https://github.com/Giganth/transformer_semantic_gp"

[tool.hatch.build.targets.wheel]
packages = ["src/TSGP"]