name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only subset of requirements.txt; the CUDA packages are not needed here.
          pip install "deap==1.4.4" "numpy==2.5.2" "pandas==3.0.5" "PyYAML==6.0.3" \
                      "scikit-learn==1.9.0" "sympy==1.14.0" "matplotlib==3.11.1" \
                      "tensorflow==2.20.0"
          pip install -e . --no-deps

      - name: Smoke test
        run: python tests/smoke_test.py
