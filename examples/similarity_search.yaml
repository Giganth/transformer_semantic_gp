# Similarity search configuration
model:

  # Settings for similarity search
  'max_length'                       : 100    # max length of expressions in tokens
  'similarity_threshold'             : 100    # largest Euclidean distance between the semantics of a pair
  'n_neighbors'                      : 3     # amt. of neighbors to retrieve from similarity search, 3 default
                

  # One directory per corpus and dimensionality; the pairs are written next to each
  # archive file as similar_pairs_<seed>.pkl.
  archive_directories:
    - 'experiments_data/GP_Archive_2_TSGP'
    - 'experiments_data/GP_Archive_3_TSGP'
    - 'experiments_data/GP_Archive_4_TSGP'
    - 'experiments_data/GP_Archive_5_TSGP'
    - 'experiments_data/GP_Archive_2_TSGP-2'
    - 'experiments_data/GP_Archive_3_TSGP-2'
    - 'experiments_data/GP_Archive_4_TSGP-2'
    - 'experiments_data/GP_Archive_5_TSGP-2'
