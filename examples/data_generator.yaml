# Example configuration for Data Generator algorithm

# Algorithm type
algorithm: data_generator

# Population size
popsize: 2000

# Initialization settings
initialization:
  mode: ramped-half-and-half  # Options: 'grow', 'full', 'ramped-half-and-half'
  min_tree_depth: 2
  max_tree_depth: 5

# Selection settings
selection:
  type: double_tournament  # Options: 'tournament', 'double_tournament'
  tournament_size: 5
  parsimony_size: 1.35  # Only used for double tournament
  fitness_first: True  # Only used for double tournament

# Variation operators
variation:
  crossover:
    application_prob: 0.9  # Probability of applying crossover
    node_bias_terminals: 0.1  # Bias towards selecting terminal nodes
  mutation:
    application_prob: 0.1  # Probability of applying mutation
    mode: 'ramped-half-and-half'  # Options: 'grow', 'full','ramped-half-and-half'
    min_tree_depth: 0
    max_tree_depth: 2
 
# Problem-specific settings
problem:
  functions: ['add', 'sub', 'mul', 'div', 'pow']  # Available functions
  ephemerals: [-0.5, 0.5]  # Range for ephemeral constants
  test_split_ratio: 0.25  # Train/test split (default 0.25)
  error_metric: RMSE  # Error metric
  standardization: True  # Whether to standardize data

data_generator:
  # ── Dataset generation mode ────────────────────────────────────────────────
  #   'make_regression'  – random linear dataset via sklearn.datasets.make_regression
  #   'target_function'  – evaluate a single user-supplied symbolic expression
  #
  # Choosing 'target_function' (with a pool, see below) is strongly recommended
  # when you want the transformer to generalise to non-linear problems.  Each
  # independent GP run then contributes semantics from a different non-linear
  # landscape, which teaches the transformer how to navigate polynomial,
  # trigonometric, and mixed curvature regimes — diversity that 'make_regression'
  # cannot provide.
  dataset_generation: target_function

  # ── Single fixed target function ───────────────────────────────────────────
  # Used when dataset_generation is 'target_function' and target_function_pool
  # is absent or empty.  Variables must be named x0 … x{num_features-1}.
  # Safe NumPy math (sin, cos, exp, log, sqrt, power, …) is available.
  # target_function: "sin(x0) + x1**2"

  # ── Target function pool (recommended for large-scale data generation) ─────
  # When set, one function is picked at random per run using the run's
  # random_seed, so that 50 parallel runs automatically cover 50 diverse
  # landscapes without any manual per-run configuration.
  #
  # The pool below mixes five structural families that are known to create
  # challenging, non-linear fitness landscapes for GP:
  #   • polynomial  — multi-modal in high dimensions
  #   • trigonometric — periodic, many local optima
  #   • exponential/decay — steep gradients, asymmetric
  #   • mixed trig+poly — coupled non-linearity
  #   • rational-like (pow with negative exponent) — singularities, sharp peaks
  target_function_pool:
    # 5-variable polynomials
    - "x0**3 - 2*x1**2 + x0*x1 + x2 - x3*x4"
    - "x0**2 + x1**2 - x0*x1 + x2**2 - x3 + x4"
    - "x0**4 - 3*x0**2*x1 + x1**3 - x2*x3 + x4**2"
    # trigonometric
    - "sin(x0) + cos(x1) + x2 - x3*x4"
    - "sin(x0 * x1) + cos(x2) - x3 + x4"
    - "sin(x0) * cos(x1) + sin(x2) - x3**2 + x4"
    - "sin(x0**2 + x1**2) + x2 - x3*x4"
    # exponential / decay
    - "exp(-x0**2) * cos(x1) + x2 - x3 + x4"
    - "exp(x0) - exp(-x1) + x2 * x3 - x4"
    - "log(abs(x0) + 1) + sqrt(abs(x1)) + x2 - x3*x4"
    # mixed trig + poly
    - "sin(x0) + x1**2 - x0*x1 + x2*x3 - x4"
    - "x0**2 * sin(x1) + x2**2 * cos(x3) - x4"
    - "sin(x0) / (abs(x1) + 1) + x2 - x3**2 + x4"
    # higher-order interactions
    - "x0**2 * x1 - x0 * x1**2 + x2*x3*x4"
    - "power(abs(x0), 1.5) - power(abs(x1), 0.5) + x2 - x3*x4"

  # Input range for uniform sampling (applies to all pool functions).
  # Keep within [-2, 2] to avoid explosion in exp / power terms.
  input_range: [-2.0, 2.0]

  num_samples_dataset: 1000 # Number of samples in the synthetic dataset which is used for the GP-Search
  num_features: 5 # Number of features in the synthetic dataset
  noise_level: 0.5 # Noise level; use lower values for non-linear targets to preserve structure
  num_samples_archive: 20000 # Number of samples to generate for the data archive
  archive_folder: trainingdata/
  simplification: True

# Reproducibility
random_seed: 1000

# Parallelization for Evaluation
num_cores: 20

# Logging
console_out: True
monitor_folder: experiments_data/logs/