# Example Standard GP Configuration
# Use with: python examples/symbolic_regression.py --config examples/standard_gp.yaml

# Algorithm type
algorithm: standard_gp

# Population size
popsize: 100

# Initialization settings
initialization:
  mode: ramped-half-and-half
  min_tree_depth: 2
  max_tree_depth: 5

# Selection settings
selection:
  type: tournament  # Options: 'tournament', 'double_tournament'
  tournament_size: 5
  parsimony_size: 1.35  # Only used for double tournament
  fitness_first: True  # Only used for double tournament

# Variation operators
variation:
  crossover:
    application_prob: 0.9  # Probability of applying crossover
    node_bias_terminals: 0.1  # Bias towards selecting terminal nodes
  mutation:
    application_prob: 0.1  # Probability of applying mutation
    mode: 'ramped-half-and-half'
    min_tree_depth: 0
    max_tree_depth: 2

# Termination conditions
termination:
  max_generations: 100

# Problem-specific settings
problem:
  dataset: feynman_I_34_27  # Dataset name
  functions: ['add', 'sub', 'mul', 'div', 'pow']  # Available functions
  ephemerals: [-0.5, 0.5]  # Range for ephemeral constants
  test_split_ratio: 0.25  # Train/test split (default 0.25)
  subsample: True # Whether to subsample data on large datasets to max 10000 samples
  error_metric: RMSE  # Error metric
  standardization: True  # Whether to standardize data

# Reproducibility
random_seed: 1000

# Parallelization for Evaluation
num_cores: 15

# Logging
console_out: True
monitor_folder: experiments_data/logs/
